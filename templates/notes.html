<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Notes - StudyMeta AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            background: #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 7%;
            border-bottom: 1px solid #263244;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }

        .back {
            text-decoration: none;
            color: white;
            background: #334155;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .back:hover {
            background: #475569;
        }

        .container {
            width: 86%;
            max-width: 1000px;
            margin: 45px auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 16px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #cbd5e1;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .btn {
            margin-top: 22px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        .notes-header {
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .notes {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            color: #e2e8f0;
            line-height: 1.8;
            font-size: 16px;
        }

        .notes h3 {
            color: #38bdf8;
            margin: 20px 0 10px;
        }

        .notes p {
            margin-bottom: 10px;
        }

        .notes li {
            margin: 8px 0 8px 22px;
        }

        .tip {
            margin-top: 18px;
            color: #94a3b8;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 5%;
            }

            .logo {
                font-size: 20px;
            }

            .container {
                width: 92%;
                margin: 30px auto;
            }

            .header h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>

</head>

<body>

    <nav>

        <div class="logo">
            StudyMeta AI 🤖
        </div>

        <a href="/dashboard" class="back">
            ← Dashboard
        </a>

    </nav>


    <div class="container">

        <div class="header">

            <h1>
                📚 AI Study Notes
            </h1>

            <p>
                Generate simple, exam-oriented notes for your important topics.
            </p>

        </div>


        <!-- GENERATE NOTES -->

        <div class="card">

            <h2>
                ✨ Generate Notes
            </h2>

            <form action="/notes" method="POST">

                <label>
                    Subject
                </label>

                <input
                    type="text"
                    name="subject"
                    placeholder="Example: DBMS"
                    required
                >

                <label>
                    Topic
                </label>

                <input
                    type="text"
                    name="topic"
                    placeholder="Example: Normalization"
                    required
                >

                <button type="submit" class="btn">
                    ✨ Generate Notes
                </button>

            </form>

            <p class="tip">
                💡 Tip: Enter a specific topic to get better exam-oriented notes.
            </p>

        </div>


        {% if notes %}

        <!-- GENERATED NOTES -->

        <div class="card">

            <h2 class="notes-header">
                📖 {{ topic }} — {{ subject }}
            </h2>

            <div class="notes">
                {{ notes|safe }}
            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
